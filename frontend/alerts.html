<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Veridict — Scam Alerts</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="main.css"/><link rel="stylesheet" href="pages.css"/>
<link rel="manifest" href="/manifest.json"/>
<style>
.alert-row{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;border-radius:var(--v-r-md);background:var(--v-card);border:1px solid var(--v-border);margin-bottom:10px}
.alert-row__icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.alert-row__preview{font-size:.84rem;margin-bottom:5px;word-break:break-word}
.alert-row__flags{font-size:.74rem;color:var(--v-faint)}
.verdict-pill{font-size:.7rem;font-weight:700;text-transform:capitalize;padding:2px 9px;border-radius:999px}
.verdict-pill.verdict--scam{background:rgba(239,68,68,.14);color:var(--v-danger)}
.verdict-pill.verdict--suspicious{background:rgba(245,158,11,.12);color:var(--v-warn)}
.filter-btn{padding:5px 14px;border-radius:999px;border:1px solid var(--v-border-md);background:transparent;color:var(--v-muted);font-size:.76rem;cursor:pointer;transition:all .18s}
.filter-btn.is-active{background:rgba(124,58,237,.16);border-color:rgba(124,58,237,.4);color:var(--v-purple-lt)}
</style>
</head><body class="p-body">
<header class="v-topbar">
  <a href="/dashboard" class="v-topbar__back"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>Dashboard</a>
  <nav class="v-topbar__nav"><a href="/dashboard" class="v-topbar__link">Dashboard</a><a href="/scanner" class="v-topbar__link">Scanner</a><a href="/alerts" class="v-topbar__link is-active">Alerts</a></nav>
  <div class="v-topbar__right"><a href="/scanner" class="btn btn--primary btn--sm">New Scan →</a></div>
</header>
<main class="p-main">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px">
    <div><h1 style="font-family:var(--v-font-d);font-size:1.6rem;font-weight:600">🔔 Scam Alerts</h1><p style="font-size:.82rem;color:var(--v-muted);margin-top:4px">Your personal threat log.</p></div>
    <a href="/api/scan/export" download class="btn btn--secondary btn--sm">⬇ Export CSV</a>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:20px">
    <button class="filter-btn is-active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="scam">Scams</button>
    <button class="filter-btn" data-filter="suspicious">Suspicious</button>
  </div>
  <div id="alertsContainer"><p style="text-align:center;padding:20px;color:var(--v-faint)">Loading alerts…</p></div>
</main>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const container=document.getElementById('alertsContainer'); let allHistory=[], activeFilter='all';
  const ICONS={message:'💬',website:'🌐',email:'📧',phone:'📞',screenshot:'📷',qr:'🔲'};
  try {
    const r=await fetch('/api/scan/history',{credentials:'same-origin'});
    if(r.status===401){window.location.href='/login';return;}
    const d=await r.json(); allHistory=(d.history||[]).filter(h=>h.verdict!=='safe'); render();
  } catch(e){ container.innerHTML='<p style="text-align:center;color:var(--v-danger)">Could not load alerts.</p>'; }
  function render() {
    const filtered=activeFilter==='all'?allHistory:allHistory.filter(h=>h.verdict===activeFilter);
    container.innerHTML='';
    if(!filtered.length){ container.innerHTML=`<div style="text-align:center;padding:60px 20px;color:var(--v-faint)"><div style="font-size:2.5rem;margin-bottom:8px">🛡️</div><p>No ${activeFilter==='all'?'threats':activeFilter+' alerts'} found.</p></div>`; return; }
    filtered.forEach(entry => {
      const icon=ICONS[entry.type]||'💬'; const flags=entry.flags?.slice(0,3).join(', ')||'No specific flags';
      const div=document.createElement('div'); div.className='alert-row';
      div.innerHTML=`<div class="alert-row__icon" style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2)">${icon}</div><div style="flex:1"><p class="alert-row__preview">${esc(entry.preview)}</p><p class="alert-row__flags">⚠ ${esc(flags)}</p></div><div style="text-align:right;flex-shrink:0"><span class="verdict-pill verdict--${entry.verdict}">${entry.verdict}</span><div style="font-size:.72rem;color:var(--v-faint);margin-top:4px">Score: ${entry.score}/100</div></div>`;
      container.appendChild(div);
    });
  }
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => { activeFilter=btn.dataset.filter; document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('is-active')); btn.classList.add('is-active'); render(); });
  });
  function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
});
</script>
</body></html>
