<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Veridict — Reset password</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="main.css"/>
<link rel="manifest" href="/manifest.json"/>
</head>
<body>
<div class="auth-shell" style="grid-template-columns:1fr">
  <div class="auth-panel" style="min-height:100vh">
    <div class="auth-card">
      <div class="auth-card__mobile-logo" style="display:flex">
        <div class="auth-brand__logo-icon" style="width:36px;height:36px"><svg width="18" height="18" viewBox="0 0 28 28" fill="none"><path d="M14 2L25 7.5V15.5C25 20.5 20 24.5 14 26C8 24.5 3 20.5 3 15.5V7.5L14 2Z" fill="rgba(255,255,255,.15)" stroke="rgba(255,255,255,.5)" stroke-width="1.5"/><path d="M9 14L12.5 17.5L19 11" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <span class="auth-brand__logo-name">VERI<span>DICT</span></span>
      </div>
      <a href="/login" class="v-back"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>Back to login</a>

      <div id="resetFormState">
        <h2 class="auth-card__title">Reset your password</h2>
        <p class="auth-card__sub">Enter a new password for your account.</p>
        <form id="resetForm" class="auth-form" novalidate>
          <input type="hidden" id="resetToken"/>
          <div class="form-field" id="newPasswordField">
            <label for="newPassword">New password</label>
            <div class="pw-wrap">
              <input type="password" id="newPassword" autocomplete="new-password" placeholder="At least 8 characters" required/>
              <button type="button" class="pw-toggle" id="newPasswordToggle" aria-label="Show password"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
            <p class="form-field__error" id="newPasswordError"></p>
          </div>
          <div class="form-field" id="confirmPasswordField">
            <label for="confirmPassword">Confirm new password</label>
            <div class="pw-wrap">
              <input type="password" id="confirmPassword" autocomplete="new-password" placeholder="Re-enter password" required/>
              <button type="button" class="pw-toggle" id="confirmPasswordToggle" aria-label="Show password"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
            <p class="form-field__error" id="confirmPasswordError"></p>
          </div>
          <button type="submit" class="btn btn--primary btn--full" id="resetBtn"><span class="btn__label">Reset password</span><span class="btn__spinner"></span></button>
          <p class="form-status" id="resetStatus"></p>
        </form>
      </div>

      <div id="invalidTokenState" hidden style="text-align:center;padding:20px 0">
        <div style="font-size:2rem;margin-bottom:14px">⚠️</div>
        <h2 class="auth-card__title">Link expired</h2>
        <p class="auth-card__sub">This password reset link has expired or is invalid. Request a new one from the login page.</p>
        <a href="/login" class="btn btn--primary btn--full">Back to login</a>
      </div>
    </div>
  </div>
</div>
<script src="auth.js"></script>
</body>
</html>
