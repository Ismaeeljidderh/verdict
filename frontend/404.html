<style>
  .error-page {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 24px;
    position: relative;
  }
  .error-page::before {
    content: "";
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(124, 92, 252, 0.18) 0%, transparent 68%);
    filter: blur(40px);
    pointer-events: none;
  }
  .error-code {
    font-family: var(--font-display);
    font-size: clamp(5rem, 12vw, 9rem);
    font-weight: 700;
    letter-spacing: -0.04em;
    background: linear-gradient(135deg, #7c5cfc, #4f8fff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1;
    margin: 0 0 16px;
    position: relative;
  }
  .error-title {
    font-family: var(--font-display);
    font-size: 1.6rem;
    font-weight: 600;
    margin: 0 0 12px;
    letter-spacing: -0.01em;
    position: relative;
  }
  .error-sub {
    font-size: 0.92rem;
    color: var(--color-text-muted);
    max-width: 380px;
    line-height: 1.6;
    margin: 0 0 36px;
    position: relative;
  }
  .error-actions {
    display: flex;
    gap: 12px;
    position: relative;
  }
  .error-actions a { text-decoration: none; }
  .error-logo {
    position: absolute;
    top: 28px;
    left: 36px;
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: var(--color-text);
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.1rem;
